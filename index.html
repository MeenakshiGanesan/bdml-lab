<!DOCTYPE html>
<html>
<head>
    <title>Amazon Review Sentiment Analyzer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #faf3f0;
            text-align: center;
            margin: 40px;
        }
        textarea {
            width: 60%;
            height: 100px;
            padding: 10px;
            font-size: 16px;
        }
        button {
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #eb7236;
            color: white;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>Amazon Fine Food Review Sentiment Analysis</h1>
    <form action="/predict" method="post">
        <textarea name="review" placeholder="Enter your review here..."></textarea><br>
        <button type="submit">Predict Sentiment</button>
    </form>
    {% if sentiment %}
        <h2>Prediction: {{ sentiment }}</h2>
        <p><b>Review:</b> {{ review }}</p>
    {% endif %}
</body>
</html>
