<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentiment Analyzer</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #eb7236, #dac0ac);
    }

    .container {
      background: #fff;
      padding: 40px 50px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      max-width: 450px;
      text-align: center;
      animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      color: #eb7236;
      font-size: 28px;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      font-size: 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
      resize: none;
      transition: 0.3s;
    }

    textarea:focus {
      border-color: #eb7236;
      box-shadow: 0 0 5px rgba(235, 114, 54, 0.5);
    }

    button {
      background: #eb7236;
      color: #fff;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.3s;
    }

    button:hover {
      background: #d55e28;
      transform: scale(1.05);
    }

    #result {
      margin-top: 25px;
      font-size: 20px;
      font-weight: 600;
      transition: 0.4s;
    }

    .positive {
      color: #28a745;
      animation: fade 0.4s ease-in-out;
    }

    .negative {
      color: #dc3545;
      animation: fade 0.4s ease-in-out;
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sentiment Analyzer</h1>
    <textarea id="review" placeholder="Type your review here..."></textarea>
    <button onclick="analyzeSentiment()">Analyze</button>
    <div id="result"></div>
  </div>

  <script>
    async function analyzeSentiment() {
      const review = document.getElementById('review').value.trim();
      const resultDiv = document.getElementById('result');
      resultDiv.innerText = "";

      if (!review) {
        resultDiv.innerText = "⚠️ Please enter a review.";
        resultDiv.className = "";
        return;
      }

      const response = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: review })
      });

      const data = await response.json();

      if (data.error) {
        resultDiv.innerText = "⚠️ Error: " + data.error;
        resultDiv.className = "";
      } else {
        resultDiv.innerText = `Sentiment: ${data.sentiment}`;
        resultDiv.className = data.sentiment === "Positive" ? "positive" : "negative";
      }
    }
  </script>
</body>
</html>
